scripts:
  setup: node -e "process.chdir(process.env.ORCA_WORKTREE_PATH||'.');import(require('url').pathToFileURL('scripts/setup.ts'))"
setupAgentStartupPolicy: start-immediately
environmentRecipes:
  - id: agent37
    name: Agent37
    create: node scripts/orca-vm/agent37-recipe.ts create
    suspend: node scripts/orca-vm/agent37-recipe.ts suspend
    resume: node scripts/orca-vm/agent37-recipe.ts resume
    update: node scripts/orca-vm/agent37-recipe.ts update
    destroy: node scripts/orca-vm/agent37-recipe.ts destroy
    prepare: node scripts/orca-vm/agent37-recipe.ts prepare
  - id: boat
    name: boat.dev
    create: node scripts/orca-vm/boat-recipe.ts create --size default
    suspend: node scripts/orca-vm/boat-recipe.ts suspend
    resume: node scripts/orca-vm/boat-recipe.ts resume
    update: node scripts/orca-vm/boat-recipe.ts update
    destroy: node scripts/orca-vm/boat-recipe.ts destroy
    prepare: node scripts/orca-vm/boat-recipe.ts prepare
